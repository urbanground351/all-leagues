name: Spor Analiz Veri Güncelleme ve Dağıtım

on:
  push:
    branches:
      - main
  schedule:
    # Her 6 saatte bir otomatik çalıştır (İsteğe göre düzenleyebilirsiniz)
    - cron: '0 */6 * * *'
  workflow_dispatch: # GitHub arayüzünden manuel tek tıkla çalıştırma

jobs:
  scrape-and-deploy:
    name: Veri Topla ve Dağıt
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Depoyu Klonla (Checkout)
        uses: actions/checkout@v4

      - name: Python 3.10 Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Botu Çalıştır ve JSON Üret
        run: |
          python bot.py

      - name: Değişiklikleri Git Deposuna Yükle
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git pull origin main --rebase || true
          git add api.json matches.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Güncel Oran ve İstatistik Verileri"
          git push

      - name: Dağıtım Paketini Hazırla (Staging)
        if: ${{ secrets.FTP_SERVER != '' }}
        run: |
          # Yalnızca api.json ve matches.json dosyalarını cPanel'e aktarmak için izole klasör
          mkdir -p deploy_dist
          cp api.json deploy_dist/
          cp matches.json deploy_dist/

      - name: JSON Dosyalarını cPanel FTP Sunucusuna Aktar
        if: ${{ secrets.FTP_SERVER != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # cPanel web sunucusundaki hedef dizin (Varsayılan: public_html/)
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'public_html/' }}
          local-dir: ./deploy_dist/
          dangerous-clean-slate: false
